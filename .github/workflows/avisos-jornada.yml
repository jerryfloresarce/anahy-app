name: Avisos de jornada (push)

# Manda un aviso al movil de Gaby aunque la app este cerrada:
#  - a las 9:00 (hora de Madrid) si no se ha iniciado la jornada
#  - a la hora de cierre (22:00, sabados 23:00) si la jornada sigue abierta
#  - y los avisos de prueba que se pidan desde Ajustes
# Se ejecuta cada 10 minutos; el script mira la hora real de Madrid y solo
# actua cuando toca (y no repite el aviso del dia aunque GitHub se retrase).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Que aviso enviar ahora mismo: prueba, iniciar o finalizar'
        required: false
        default: 'prueba'

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save web-push@3
      - run: node scripts/avisos-jornada.js
        env:
          VAPID_PUBLIC_KEY: BLwaEFvMNJ5iPA07eH11aVgU8hg4TothAJWsLVRFr8LodsK_VCgbEWUuM2Bsu6qCG5bMd4MAJi1Zw9jD8gCk9bQ
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORZAR: ${{ github.event.inputs.forzar }}
